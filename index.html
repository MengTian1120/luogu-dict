<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#0f2c3f" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>洛谷词典 · 社区语言速查</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        /* ========= 样式（与之前保持一致） ========= */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --bg-body: #eef2f7;
            --bg-main: #f8fafd;
            --bg-card: white;
            --bg-card-rgb: 255,255,255;
            --bg-sidebar: linear-gradient(180deg,#0f2c3f 0%,#123e56 100%);
            --sidebar-text: #e6f3ff;
            --sidebar-text-muted: #9ab3c7;
            --sidebar-hover: rgba(255,255,255,0.1);
            --sidebar-active: #2c7da0;
            --border-light: #e2eaf1;
            --border-card: #e7eef5;
            --text-primary: #2b4c6e;
            --text-secondary: #54738f;
            --text-abbr: #136b96;
            --search-bg: #f2f6fa;
            --search-border: #dce5ef;
            --search-focus: #2c8fbb;
            --mark-bg: #ffecb3;
            --mark-text: #b55a0c;
            --info-bg: white;
            --footer-bg: white;
            --skeleton-bg: #e2e8f0;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.08);
            --shadow-md: 0 12px 22px rgba(0,0,0,0.08);
            --list-item-hover: rgba(44,143,187,0.08);
            --list-item-active: rgba(44,143,187,0.15);
            --detail-bg: var(--bg-card);
        }
        body.dark {
            --bg-body: #121212;
            --bg-main: #1e1e2e;
            --bg-card: #2a2a3a;
            --bg-card-rgb: 42,42,58;
            --bg-sidebar: linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
            --sidebar-text: #c9d1d9;
            --sidebar-text-muted: #8b949e;
            --sidebar-hover: rgba(255,255,255,0.08);
            --sidebar-active: #2c7da0;
            --border-light: #2d2d3a;
            --border-card: #2d2d3a;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-abbr: #58a6ff;
            --search-bg: #2d2d3a;
            --search-border: #3d3d4a;
            --search-focus: #58a6ff;
            --mark-bg: #5c3a00;
            --mark-text: #ffd966;
            --info-bg: #2a2a3a;
            --footer-bg: #2a2a3a;
            --skeleton-bg: #3d3d4a;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.3);
            --shadow-md: 0 12px 22px rgba(0,0,0,0.3);
            --list-item-hover: rgba(88,166,255,0.1);
            --list-item-active: rgba(88,166,255,0.2);
            --detail-bg: #2a2a3a;
        }
        body { background:var(--bg-body); font-family:system-ui,-apple-system,'Segoe UI','Roboto','Noto Sans',sans-serif; height:100vh; overflow:hidden; touch-action:pan-y; transition:background-color 0.2s ease; }
        .app { display:flex; height:100vh; width:100%; position:relative; }
        /* 侧边栏保持不变 */
        .sidebar { position:fixed; left:0; top:0; width:280px; height:100%; background:var(--bg-sidebar); color:var(--sidebar-text); display:flex; flex-direction:column; z-index:100; transform:translateX(-100%); transition:transform 0.25s cubic-bezier(0.2,0.9,0.4,1.1); box-shadow:2px 0 20px rgba(0,0,0,0.15); overflow-y:auto; overscroll-behavior:contain; }
        .sidebar.open { transform:translateX(0); }
        .sidebar-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); z-index:90; opacity:0; visibility:hidden; transition:opacity 0.25s ease, visibility 0.25s; backdrop-filter:blur(2px); }
        .sidebar-overlay.active { opacity:1; visibility:visible; }
        .sidebar-header { padding:1.2rem 1.2rem; border-bottom:1px solid rgba(255,255,255,0.12); position:sticky; top:0; background:inherit; z-index:2; }
        .sidebar-header h2 { font-size:1.3rem; font-weight:600; display:flex; align-items:center; gap:8px; }
        .dict-list { flex:1; padding:0.75rem 0.5rem; list-style:none; }
        .dict-item { margin:0.2rem 0.5rem; border-radius:0.9rem; transition:all 0.2s; }
        .dict-item button { width:100%; text-align:left; background:transparent; border:none; padding:0.7rem 1rem; font-size:0.95rem; font-weight:500; color:var(--sidebar-text); cursor:pointer; border-radius:0.9rem; display:flex; align-items:center; justify-content:space-between; transition:0.2s; touch-action:manipulation; }
        .dict-item button:active { background:var(--sidebar-hover); transform:scale(0.98); }
        .dict-item.active button { background:var(--sidebar-active); color:white; box-shadow:var(--shadow-sm); }
        .dict-name { display:flex; align-items:center; gap:8px; word-break:break-word; }
        .dict-count { font-size:0.7rem; background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:30px; }
        /* 主内容 */
        .main-content { flex:1; display:flex; flex-direction:column; overflow-y:auto; background:var(--bg-main); width:100%; scroll-behavior:smooth; }
        .top-bar { background:var(--bg-card); padding:0.75rem 1rem; border-bottom:1px solid var(--border-light); display:flex; flex-wrap:wrap; align-items:center; gap:0.75rem; position:sticky; top:0; z-index:5; backdrop-filter:blur(10px); background:rgba(var(--bg-card-rgb),0.95); }
        .menu-toggle { background:var(--search-bg); border:1px solid var(--search-border); border-radius:40px; padding:8px 14px; font-size:1.1rem; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; touch-action:manipulation; transition:0.1s; color:var(--text-abbr); }
        .menu-toggle:active { background:var(--border-light); transform:scale(0.96); }
        .search-section { flex:2; min-width:160px; display:flex; gap:8px; position:relative; }
        .search-box { flex:1; display:flex; align-items:center; background:var(--search-bg); border:1px solid var(--search-border); border-radius:40px; padding:0.25rem 0.9rem; transition:0.2s; position:relative; }
        .search-box:focus-within { background:var(--bg-card); border-color:var(--search-focus); box-shadow:0 0 0 3px rgba(44,143,187,0.1); }
        .search-box span { color:var(--text-secondary); margin-right:6px; font-size:0.9rem; }
        #searchInput { border:none; background:transparent; padding:0.6rem 0; width:100%; outline:none; font-size:0.95rem; color:var(--text-primary); }
        #searchInput::placeholder { color:var(--text-secondary); }
        .clear-search-btn { background:transparent; border:none; color:var(--text-secondary); font-size:1.2rem; cursor:pointer; padding:0 4px; margin-left:4px; display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; transition:0.2s; flex-shrink:0; opacity:0.7; touch-action:manipulation; }
        .clear-search-btn:hover { background:var(--border-light); opacity:1; }
        .clear-search-btn:active { transform:scale(0.9); background:var(--border-light); }
        .clear-search-btn.hidden { display:none; }
        .search-kbd-hint { display:flex; align-items:center; gap:4px; background:var(--border-light); padding:3px 8px; border-radius:30px; font-size:0.7rem; font-family:monospace; color:var(--text-secondary); font-weight:500; margin-left:8px; flex-shrink:0; pointer-events:none; }
        .search-kbd-hint kbd { background:var(--bg-card); padding:2px 6px; border-radius:6px; font-size:0.7rem; font-weight:600; color:var(--text-primary); box-shadow:0 1px 1px rgba(0,0,0,0.1); font-family:monospace; }
        .theme-toggle { background:var(--search-bg); border:1px solid var(--search-border); border-radius:40px; padding:8px; width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.1s; font-size:1.1rem; }
        .theme-toggle:active { transform:scale(0.95); }
        .github-link { display:inline-flex; align-items:center; justify-content:center; background:#24292e; color:white; padding:8px; border-radius:40px; text-decoration:none; transition:0.2s; width:36px; height:36px; }
        .github-link span { display:none; }
        .github-link svg { width:20px; height:20px; fill:white; }
        .github-link:active { background:#0366d6; transform:scale(0.95); }
        .info-area { background:var(--info-bg); margin:0.75rem 1rem 0 1rem; padding:0.5rem 1rem; border-radius:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; font-size:0.8rem; border:1px solid var(--border-light); }
        .current-dict-name { background:var(--search-bg); padding:0.2rem 0.8rem; border-radius:30px; font-weight:600; color:var(--text-abbr); font-size:0.8rem; }
        .stats { color:var(--text-secondary); font-size:0.75rem; }

        /* 列表 + 详情布局（固定结构） */
        .dict-content { flex:1; display:flex; flex-direction:column; padding:0.75rem 1rem 0.5rem 1rem; min-height:0; }
        .entry-list-wrapper { flex:1 1 50%; min-height:200px; border:1px solid var(--border-card); border-radius:1rem; background:var(--bg-card); overflow:hidden; display:flex; flex-direction:column; margin-bottom:0.75rem; }
        .entry-list-header { padding:0.5rem 1rem; border-bottom:1px solid var(--border-light); font-size:0.85rem; font-weight:600; color:var(--text-secondary); display:flex; justify-content:space-between; background:var(--bg-card); flex-shrink:0; }
        .entry-list-scroll { flex:1; overflow-y:auto; position:relative; will-change:scroll-position; }
        .entry-list { list-style:none; padding:0; margin:0; position:relative; }
        .entry-list-item { padding:0.6rem 1rem; cursor:pointer; border-bottom:1px solid var(--border-light); transition:background 0.15s; display:flex; align-items:center; font-size:0.95rem; color:var(--text-primary); touch-action:manipulation; }
        .entry-list-item:active { background:var(--list-item-hover); }
        .entry-list-item:hover { background:var(--list-item-hover); }
        .entry-list-item.active { background:var(--list-item-active); border-left:3px solid var(--search-focus); }
        .entry-list-item .abbr-text { font-weight:600; font-family:'SF Mono','Fira Code',monospace; color:var(--text-abbr); word-break:break-word; }
        .entry-list-item .match-hint { font-size:0.7rem; color:var(--text-secondary); margin-left:0.5rem; opacity:0.7; }
        .entry-detail-wrapper { flex:1 1 50%; min-height:150px; border:1px solid var(--border-card); border-radius:1rem; background:var(--detail-bg); overflow-y:auto; padding:1rem 1.2rem; }
        .entry-detail-wrapper .empty-detail { color:var(--text-secondary); font-size:0.9rem; text-align:center; padding:2rem 0; }
        .entry-detail-wrapper .detail-abbr { font-size:1.4rem; font-weight:700; font-family:'SF Mono','Fira Code',monospace; color:var(--text-abbr); margin-bottom:0.75rem; border-bottom:2px solid var(--border-light); padding-bottom:0.5rem; }
        .entry-detail-wrapper .detail-meaning { font-size:0.95rem; line-height:1.6; color:var(--text-primary); }
        .entry-detail-wrapper .detail-meaning p { margin:0.5rem 0; }
        .entry-detail-wrapper .detail-meaning code { background:var(--search-bg); padding:0.1rem 0.4rem; border-radius:4px; font-size:0.9em; }
        .entry-detail-wrapper .detail-meaning pre { background:var(--search-bg); padding:0.8rem; border-radius:0.6rem; overflow-x:auto; margin:0.5rem 0; }
        .entry-detail-wrapper .detail-meaning blockquote { border-left:3px solid var(--search-focus); padding-left:1rem; margin:0.5rem 0; color:var(--text-secondary); }
        .entry-detail-wrapper .detail-meaning a { color:var(--text-abbr); text-decoration:underline; }

        /* 骨架屏（加载动画） */
        .skeleton-list { padding:0.5rem 1rem; }
        .skeleton-item { display:flex; align-items:center; padding:0.6rem 0; border-bottom:1px solid var(--border-light); }
        .skeleton-item .skeleton-abbr { height:1rem; width:40%; background:var(--skeleton-bg); border-radius:6px; animation:pulse 1.2s infinite ease-in-out; }
        .skeleton-item .skeleton-hint { height:0.7rem; width:20%; background:var(--skeleton-bg); border-radius:6px; margin-left:0.5rem; animation:pulse 1.2s infinite ease-in-out; }
        .skeleton-detail { padding:1rem 0; }
        .skeleton-detail .skeleton-title { height:1.8rem; width:30%; background:var(--skeleton-bg); border-radius:8px; margin-bottom:1rem; animation:pulse 1.2s infinite ease-in-out; }
        .skeleton-detail .skeleton-line { height:0.9rem; background:var(--skeleton-bg); border-radius:6px; margin-bottom:0.6rem; animation:pulse 1.2s infinite ease-in-out; }
        .skeleton-detail .skeleton-line.short { width:60%; }
        @keyframes pulse { 0% { opacity:0.6; } 50% { opacity:1; } 100% { opacity:0.6; } }

        /* 空状态 / 错误状态（显示在列表区域） */
        .state-message { padding:2rem 1rem; text-align:center; color:var(--text-secondary); font-size:0.9rem; }
        .state-message button { background:var(--search-focus); border:none; color:white; padding:0.5rem 1.5rem; border-radius:2rem; font-weight:500; cursor:pointer; margin-top:1rem; transition:0.2s; border:1px solid transparent; }
        .state-message button:active { transform:scale(0.96); opacity:0.9; }

        .footer { background:var(--footer-bg); border-top:1px solid var(--border-light); padding:0.7rem 1rem; text-align:center; font-size:0.7rem; color:var(--text-secondary); }
        .footer a { color:var(--text-abbr); text-decoration:none; }

        @media (min-width:768px) {
            .dict-content { flex-direction:row; gap:1rem; padding:0.75rem 1.5rem 0.5rem 1.5rem; }
            .entry-list-wrapper { flex:1 1 40%; min-height:300px; margin-bottom:0; }
            .entry-detail-wrapper { flex:1 1 60%; min-height:300px; }
            .sidebar { position:relative; transform:translateX(0)!important; width:280px; }
            .sidebar-overlay { display:none; }
            .menu-toggle { display:none; }
            .github-link { width:auto; padding:6px 14px; }
            .github-link span { display:inline; }
            .github-link svg { width:18px; height:18px; }
            .top-bar { padding:1rem 1.5rem; }
        }
        @media (max-width:480px) {
            .search-kbd-hint kbd { padding:1px 4px; font-size:0.65rem; }
            .search-kbd-hint { padding:2px 5px; gap:2px; }
            .entry-detail-wrapper { padding:0.8rem; }
        }
        .entry-list-scroll::-webkit-scrollbar, .entry-detail-wrapper::-webkit-scrollbar { width:4px; }
        .entry-list-scroll::-webkit-scrollbar-track, .entry-detail-wrapper::-webkit-scrollbar-track { background:var(--bg-body); }
        .entry-list-scroll::-webkit-scrollbar-thumb, .entry-detail-wrapper::-webkit-scrollbar-thumb { background:var(--border-card); border-radius:4px; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2>📚 洛谷词典</h2></div>
        <ul class="dict-list" id="dictList"><li style="padding:1rem;text-align:center;color:var(--sidebar-text-muted);">加载词典列表...</li></ul>
    </aside>
    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggleBtn" aria-label="菜单">☰ 词典</button>
            <div class="search-section">

                    <input type="text" id="searchInput" placeholder="搜索缩写或含义..." autocomplete="off" enterkeyhint="search" aria-label="搜索">
                    <button class="clear-search-btn hidden" id="clearSearchBtn" aria-label="清除搜索" title="清除">✕</button>
                    <div class="search-kbd-hint"><kbd>Ctrl</kbd><kbd>K</kbd></div>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="深色模式">🌙</button>
            <a href="https://github.com/MengTian1120/luogu-dict" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="18" height="18">

                </svg>
                <span>GitHub</span>
            </a>
        </div>

            <div><span class="current-dict-name" id="currentDictDisplay">-</span></div>

<script>
    (function(){
        "use strict";

        // ---------- 配置 ----------
        const DICT_DIR = 'dicts/';
        const DICT_LIST_FILE = 'dicts.txt';
        const FETCH_TIMEOUT = 8000;
        const SEARCH_DEBOUNCE_DELAY = 200;
        const VIRTUAL_SCROLL_THRESHOLD = 300;

        let dictFileNames = [];
        let currentDictIndex = 0;
        let currentEntries = [];
        let currentSearchKeyword = '';
        let searchDebounceTimer = null;
        let abortController = null;

        const dictCache = new Map();
        const scrollPositions = new Map();

        let selectedEntry = null;
        let selectedIndex = -1;

        let useVirtualScroll = false;
        let virtualScrollContainer = null;
        let virtualScrollList = null;
        let itemHeight = 45;
        let virtualUpdateFn = null;
        let scrollHandler = null;
        let currentFilteredEntries = [];

        // DOM 元素
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const dictListEl = document.getElementById('dictList');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const dictContent = document.getElementById('dictContent');
        const mainContent = document.querySelector('.main-content');
        const currentDictDisplaySpan = document.getElementById('currentDictDisplay');
        const statsInfoSpan = document.getElementById('statsInfo');
        const themeToggle = document.getElementById('themeToggle');

        const entryList = document.getElementById('entryList');
        const entryListScroll = document.getElementById('entryListScroll');
        const entryDetailWrapper = document.getElementById('entryDetailWrapper');
        const listCountSpan = document.getElementById('listCount');

        // ---------- 辅助 ----------
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
        function highlightText(text, keyword) {
            if(!keyword || !keyword.trim()) return escapeHtml(text);
            const kw = escapeHtml(keyword).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            if(!kw) return escapeHtml(text);
            const regex = new RegExp(`(${kw})`,'gi');
            return escapeHtml(text).replace(regex, '<mark>$1</mark>');
        }
        function parseTxtToEntries(text) {
            const lines = text.split(/\r?\n/);
            const entries = [];
            for(let line of lines) {
                line = line.trim();
                if(!line || line.startsWith('#')) continue;
                const sep = line.indexOf('|');
                if(sep === -1) continue;
                let abbr = line.substring(0, sep).trim();
                let meaning = line.substring(sep+1).trim();
                if(abbr && meaning) entries.push({ abbr, meaning });
            }
            return entries;
        }
        function getDisplayNameFromFile(fileName) {
            return fileName.toLowerCase().endsWith('.txt') ? fileName.slice(0, -4) : fileName;
        }
        function sortEntriesByRelevance(entries, keyword) {
            if(!keyword.trim()) return entries;
            const kw = keyword.toLowerCase().trim();
            return [...entries].sort((a,b) => {
                const aAbbr = a.abbr.toLowerCase(), bAbbr = b.abbr.toLowerCase();
                const aMeaning = a.meaning.toLowerCase(), bMeaning = b.meaning.toLowerCase();
                const aAbbrMatch = aAbbr.includes(kw), bAbbrMatch = bAbbr.includes(kw);
                if(aAbbrMatch !== bAbbrMatch) return aAbbrMatch ? -1 : 1;
                if(aAbbrMatch && bAbbrMatch) {
                    if(aAbbr === kw && bAbbr !== kw) return -1;
                    if(bAbbr === kw && aAbbr !== kw) return 1;
                    const aIdx = aAbbr.indexOf(kw), bIdx = bAbbr.indexOf(kw);
                    if(aIdx !== bIdx) return aIdx - bIdx;
                    return a.abbr.length - b.abbr.length;
                }
                const aMatch = aMeaning.includes(kw), bMatch = bMeaning.includes(kw);
                if(aMatch !== bMatch) return aMatch ? -1 : 1;
                const aIdx = aMeaning.indexOf(kw), bIdx = bMeaning.indexOf(kw);
                if(aIdx !== bIdx) return aIdx - bIdx;
                return a.abbr.localeCompare(b.abbr);
            });
        }

        // ---------- 测量列表项高度 ----------
        function measureListItemHeight() {
            const testItem = document.createElement('li');
            testItem.className = 'entry-list-item';
            testItem.style.cssText = 'visibility:hidden;position:absolute;top:-9999px;left:0;right:0;';
            testItem.innerHTML = `<span class="abbr-text">TEST</span>`;
            document.body.appendChild(testItem);
            const height = testItem.offsetHeight;
            document.body.removeChild(testItem);
            return height + 1;
        }

        // ---------- 深色模式 ----------
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if(saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
            updateThemeColor();
        }
        function toggleTheme() {
            if(document.body.classList.contains('dark')) {
                document.body.classList.remove('dark');
                localStorage.setItem('theme','light');
                themeToggle.textContent = '🌙';
            } else {
                document.body.classList.add('dark');
                localStorage.setItem('theme','dark');
                themeToggle.textContent = '☀️';
            }
            updateThemeColor();
        }
        function updateThemeColor() {
            const isDark = document.body.classList.contains('dark');
            const meta = document.querySelector('meta[name="theme-color"]');
            if(meta) meta.setAttribute('content', isDark ? '#1a1a2e' : '#0f2c3f');
        }
        function updateKbdHint() {
            const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform) || /Mac|iPod|iPhone|iPad/.test(navigator.userAgent);
            const hint = document.querySelector('.search-kbd-hint');
            if(hint) hint.innerHTML = isMac ? `<kbd>⌘</kbd><kbd>K</kbd>` : `<kbd>Ctrl</kbd><kbd>K</kbd>`;
        }

        // ---------- 渲染详情 ----------
        function renderDetail(entry) {
            if(!entry) {
                entryDetailWrapper.innerHTML = `<div class="empty-detail">👆 点击左侧词条查看详细含义</div>`;
                return;
            }
            let meaningHtml = '';
            try {
                const raw = marked.parse(entry.meaning);
                meaningHtml = DOMPurify.sanitize(raw);
            } catch(e) {
                meaningHtml = escapeHtml(entry.meaning);
            }
            entryDetailWrapper.innerHTML = `
                <div class="detail-abbr">${escapeHtml(entry.abbr)}</div>
                <div class="detail-meaning">${meaningHtml}</div>
            `;
        }

        // ---------- 显示骨架加载动画 ----------
        function showSkeleton() {
            // 列表骨架
            let skeletonItems = '';
            for(let i=0; i<6; i++) {
                skeletonItems += `
                    <div class="skeleton-item">
                        <div class="skeleton-abbr"></div>
                        <div class="skeleton-hint"></div>
                    </div>
                `;
            }
            entryList.innerHTML = `<div class="skeleton-list">${skeletonItems}</div>`;
            listCountSpan.textContent = '...';
            // 详情骨架
            entryDetailWrapper.innerHTML = `
                <div class="skeleton-detail">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                </div>
            `;
            useVirtualScroll = false;
        }

        // ---------- 列表渲染（普通模式） ----------
        function renderAllListItems(filtered, keyword) {
            let html = '';
            const kw = keyword.trim();
            filtered.forEach((item, index) => {
                const activeClass = (selectedEntry === item) ? 'active' : '';
                const abbrHtml = highlightText(item.abbr, kw);
                let matchHint = '';
                if(kw && item.meaning.toLowerCase().includes(kw.toLowerCase())) {
                    matchHint = `<span class="match-hint">(含义匹配)</span>`;
                }
                html += `<li class="entry-list-item ${activeClass}" data-index="${index}">
                            <span class="abbr-text">${abbrHtml}</span>
                            ${matchHint}
                         </li>`;
            });
            entryList.innerHTML = html;
            entryList.querySelectorAll('.entry-list-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    const idx = parseInt(this.getAttribute('data-index'), 10);
                    if(!isNaN(idx) && idx < filtered.length) {
                        selectEntry(filtered[idx], idx);
                    }
                });
            });
            useVirtualScroll = false;
        }

        // ---------- 虚拟滚动 ----------
        function setupVirtualList(filtered, keyword) {
            if(virtualUpdateFn) virtualUpdateFn = null;
            if(scrollHandler && virtualScrollContainer) {
                virtualScrollContainer.removeEventListener('scroll', scrollHandler);
                scrollHandler = null;
            }
            const container = entryListScroll;
            const list = entryList;
            const kw = keyword.trim();
            list.innerHTML = '';
            list.style.position = 'relative';
            const totalHeight = filtered.length * itemHeight;
            list.style.height = totalHeight + 'px';

            function updateVisibleItems() {
                const scrollTop = container.scrollTop;
                const containerHeight = container.clientHeight;
                const start = Math.max(0, Math.floor(scrollTop / itemHeight) - 5);
                const end = Math.min(filtered.length, Math.ceil((scrollTop + containerHeight) / itemHeight) + 5);
                let html = '';
                for(let i=start; i<end; i++) {
                    const item = filtered[i];
                    const activeClass = (selectedEntry === item) ? 'active' : '';
                    const abbrHtml = highlightText(item.abbr, kw);
                    let matchHint = '';
                    if(kw && item.meaning.toLowerCase().includes(kw.toLowerCase())) {
                        matchHint = `<span class="match-hint">(含义匹配)</span>`;
                    }
                    html += `<li class="entry-list-item ${activeClass}" data-index="${i}" style="position:absolute; top:${i * itemHeight}px; left:0; right:0; height:${itemHeight}px; display:flex; align-items:center; padding:0 1rem; border-bottom:1px solid var(--border-light);">
                                <span class="abbr-text">${abbrHtml}</span>
                                ${matchHint}
                             </li>`;
                }
                list.innerHTML = html;
            }

            list.addEventListener('click', function(e) {
                const li = e.target.closest('.entry-list-item');
                if(li) {
                    const idx = parseInt(li.getAttribute('data-index'), 10);
                    if(!isNaN(idx) && idx < filtered.length) {
                        selectEntry(filtered[idx], idx);
                    }
                }
            });

            scrollHandler = function() { requestAnimationFrame(updateVisibleItems); };
            container.addEventListener('scroll', scrollHandler);
            virtualUpdateFn = updateVisibleItems;
            virtualScrollContainer = container;
            virtualScrollList = list;
            useVirtualScroll = true;
            updateVisibleItems();
        }

        // ---------- 选择条目 ----------
        function selectEntry(entry, index) {
            if(!entry) {
                selectedEntry = null;
                selectedIndex = -1;
                renderDetail(null);
                if(useVirtualScroll && virtualUpdateFn) virtualUpdateFn();
                else updateListActive();
                return;
            }
            selectedEntry = entry;
            selectedIndex = index;
            renderDetail(entry);
            if(useVirtualScroll && virtualUpdateFn) {
                virtualUpdateFn();
                if(virtualScrollContainer) {
                    const target = index * itemHeight - virtualScrollContainer.clientHeight/2 + itemHeight/2;
                    virtualScrollContainer.scrollTop = Math.max(0, target);
                }
            } else {
                updateListActive();
                const items = entryList.querySelectorAll('.entry-list-item');
                if(items[index]) items[index].scrollIntoView({ block:'nearest', behavior:'smooth' });
            }
        }

        function updateListActive() {
            const items = entryList.querySelectorAll('.entry-list-item');
            items.forEach(el => {
                const idx = parseInt(el.getAttribute('data-index'), 10);
                if(!isNaN(idx) && currentFilteredEntries[idx] === selectedEntry) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // ---------- 显示状态消息（空/错误）在列表区域 ----------
        function showListMessage(html, countText = '0') {
            entryList.innerHTML = `<div class="state-message">${html}</div>`;
            listCountSpan.textContent = countText;
            useVirtualScroll = false;
            // 清空详情
            renderDetail(null);
        }

        // ---------- 核心渲染函数 ----------
        function renderContent() {
            // 如果没有任何词典文件
            if(!dictFileNames.length) {
                showListMessage('📭 未检测到词典列表<br>请确保 dicts.txt 文件存在', '0');
                statsInfoSpan.innerHTML = '无词典配置';
                currentDictDisplaySpan.innerText = '无';
                return;
            }
            // 当前词典无条目
            if(currentEntries.length === 0) {
                showListMessage('📭 当前词典无有效条目', '0');
                statsInfoSpan.innerHTML = '📚 共 0 条';
                return;
            }

            const keyword = currentSearchKeyword.trim();
            let filtered = currentEntries;
            if(keyword) {
                const lower = keyword.toLowerCase();
                filtered = currentEntries.filter(item => 
                    item.abbr.toLowerCase().includes(lower) || 
                    item.meaning.toLowerCase().includes(lower)
                );
                filtered = sortEntriesByRelevance(filtered, keyword);
            }
            currentFilteredEntries = filtered;
            listCountSpan.textContent = filtered.length;
            statsInfoSpan.innerHTML = `📚 共 ${currentEntries.length} 条 | 显示 ${filtered.length} 条`;

            // 选中状态处理
            if(selectedEntry && !filtered.includes(selectedEntry)) {
                selectEntry(null, -1);
            }
            if(filtered.length > 0 && !selectedEntry) {
                selectEntry(filtered[0], 0);
            } else if(filtered.length === 0) {
                selectEntry(null, -1);
            } else {
                if(useVirtualScroll && virtualUpdateFn) virtualUpdateFn();
                else updateListActive();
            }

            // 渲染列表
            if(filtered.length > VIRTUAL_SCROLL_THRESHOLD) {
                // 清除旧的虚拟滚动状态
                if(virtualUpdateFn) virtualUpdateFn = null;
                if(scrollHandler && virtualScrollContainer) {
                    virtualScrollContainer.removeEventListener('scroll', scrollHandler);
                    scrollHandler = null;
                }
                itemHeight = measureListItemHeight();
                setupVirtualList(filtered, keyword);
            } else {
                if(virtualUpdateFn) virtualUpdateFn = null;
                if(scrollHandler && virtualScrollContainer) {
                    virtualScrollContainer.removeEventListener('scroll', scrollHandler);
                    scrollHandler = null;
                }
                renderAllListItems(filtered, keyword);
            }

            // 清除按钮
            if(clearSearchBtn) {
                if(keyword) clearSearchBtn.classList.remove('hidden');
                else clearSearchBtn.classList.add('hidden');
            }
        }

        // ---------- 加载词典 ----------
        async function loadDictionary(index) {
            if(!dictFileNames.length || index >= dictFileNames.length || index < 0) {
                currentEntries = [];
                renderContent();
                return false;
            }
            if(abortController) abortController.abort();
            abortController = new AbortController();

            const fileName = dictFileNames[index];
            const filePath = DICT_DIR + fileName;
            const displayName = getDisplayNameFromFile(fileName);
            currentDictDisplaySpan.innerText = displayName;

            // 检查缓存
            if(dictCache.has(fileName)) {
                const cached = dictCache.get(fileName);
                currentEntries = cached.entries;
                statsInfoSpan.innerHTML = `✅ 共 ${currentEntries.length} 条 (缓存)`;
                updateSidebarCount(index, currentEntries.length);
                selectedEntry = null;
                selectedIndex = -1;
                renderContent();
                return true;
            }

            // 显示加载动画（骨架）
            statsInfoSpan.innerHTML = '⏳ 加载中...';
            showSkeleton();

            try {
                const response = await fetchWithTimeout(filePath, FETCH_TIMEOUT);
                if(!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const entries = parseTxtToEntries(text);
                if(entries.length === 0) throw new Error('无有效条目');

                dictCache.set(fileName, { entries, timestamp: Date.now() });
                currentEntries = entries;
                statsInfoSpan.innerHTML = `✅ 共 ${currentEntries.length} 条`;
                updateSidebarCount(index, currentEntries.length);
                selectedEntry = null;
                selectedIndex = -1;
                renderContent();
                return true;
            } catch(err) {
                currentEntries = [];
                statsInfoSpan.innerHTML = `❌ 加载失败`;
                updateSidebarCount(index, '!');
                // 显示错误信息在列表区域
                showListMessage(`
                    ❌ 无法加载 “${escapeHtml(displayName)}”<br>
                    <span style="font-size:0.8rem;">${escapeHtml(err.message)}</span>
                    <div><button id="retryLoadBtn">🔄 重试加载</button></div>
                `, '!');
                document.getElementById('retryLoadBtn')?.addEventListener('click', () => {
                    dictCache.delete(fileName);
                    loadDictionary(index);
                });
                return false;
            } finally {
                if(abortController && !abortController.signal.aborted) abortController = null;
            }
        }

        async function fetchWithTimeout(url, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                clearTimeout(timeoutId);
                return response;
            } catch(err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }

        // ---------- 侧边栏 ----------
        function renderSidebar() {
            if(!dictFileNames.length) {
                dictListEl.innerHTML = `<li style="padding:1rem;text-align:center;color:var(--sidebar-text-muted);">⚠️ 无可用词典<br><span style="font-size:0.7rem;">请确保 dicts.txt 存在</span></li>`;
                return;
            }
            const itemsHtml = dictFileNames.map((fileName, idx) => {
                const displayName = getDisplayNameFromFile(fileName);
                const activeClass = (idx === currentDictIndex) ? 'active' : '';
                return `<li class="dict-item ${activeClass}" data-index="${idx}"><button><span class="dict-name">📖 ${escapeHtml(displayName)}</span><span class="dict-count" id="count-${idx}">?</span></button></li>`;
            }).join('');
            dictListEl.innerHTML = itemsHtml;
            document.querySelectorAll('.dict-item').forEach(item => {
                const btn = item.querySelector('button');
                if(btn) {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(item.getAttribute('data-index'), 10);
                        if(!isNaN(idx) && idx !== currentDictIndex) {
                            switchToDict(idx);
                            closeSidebar();
                        }
                    });
                }
            });
        }

        function updateSidebarActive() {
            document.querySelectorAll('.dict-item').forEach(item => {
                const idx = parseInt(item.getAttribute('data-index'), 10);
                if(idx === currentDictIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        function updateSidebarCount(index, count) {
            const span = document.getElementById(`count-${index}`);
            if(span) span.innerText = count;
        }

        async function switchToDict(newIndex) {
            if(newIndex === currentDictIndex) return;
            // 清除虚拟滚动状态
            if(virtualUpdateFn) virtualUpdateFn = null;
            if(scrollHandler && virtualScrollContainer) {
                virtualScrollContainer.removeEventListener('scroll', scrollHandler);
                scrollHandler = null;
            }
            currentDictIndex = newIndex;
            searchInput.value = '';
            currentSearchKeyword = '';
            if(clearSearchBtn) clearSearchBtn.classList.add('hidden');
            updateSidebarActive();
            if(dictFileNames[currentDictIndex]) currentDictDisplaySpan.innerText = getDisplayNameFromFile(dictFileNames[currentDictIndex]);
            selectedEntry = null;
            selectedIndex = -1;
            await loadDictionary(currentDictIndex);
        }

        async function loadDictList() {
            try {
                const response = await fetchWithTimeout(DICT_LIST_FILE, FETCH_TIMEOUT);
                if(!response.ok) throw new Error(`dicts.txt 不存在`);
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                const files = [];
                for(let line of lines) {
                    line = line.trim();
                    if(line && !line.startsWith('#')) files.push(line);
                }
                if(files.length === 0) throw new Error('dicts.txt 内容为空');
                dictFileNames = files;
                renderSidebar();
                currentDictIndex = 0;
                updateSidebarActive();
                if(dictFileNames.length) {
                    currentDictDisplaySpan.innerText = getDisplayNameFromFile(dictFileNames[0]);
                    await loadDictionary(0);
                }
            } catch(err) {
                dictFileNames = [];
                renderSidebar();
                showListMessage(`❌ 无法读取 dicts.txt<br><span style="font-size:0.8rem;">${escapeHtml(err.message)}</span><br><br>💡 请确保根目录存在 dicts.txt 文件`, '0');
                statsInfoSpan.innerHTML = '列表缺失';
                currentDictDisplaySpan.innerText = '无';
            }
        }

        // ---------- 搜索 ----------
        function onSearchInput() {
            if(searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                currentSearchKeyword = searchInput.value;
                selectedEntry = null;
                selectedIndex = -1;
                renderContent();
            }, SEARCH_DEBOUNCE_DELAY);
        }

        function resetSearch() {
            if(searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchInput.value = '';
            currentSearchKeyword = '';
            if(clearSearchBtn) clearSearchBtn.classList.add('hidden');
            selectedEntry = null;
            selectedIndex = -1;
            renderContent();
            searchInput.focus();
        }

        // ---------- 侧边栏控制 ----------
        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ---------- 事件绑定 ----------
        function bindEvents() {
            searchInput.addEventListener('input', onSearchInput);
            if(clearSearchBtn) clearSearchBtn.addEventListener('click', (e) => { e.stopPropagation(); resetSearch(); });
            menuToggleBtn.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            themeToggle.addEventListener('click', toggleTheme);

            entryListScroll.addEventListener('scroll', function() {
                if(!useVirtualScroll && currentDictIndex !== undefined) {
                    scrollPositions.set(currentDictIndex, entryListScroll.scrollTop);
                }
            }, { passive: true });

            window.addEventListener('resize', () => {
                if(window.innerWidth >= 768 && sidebar.classList.contains('open')) closeSidebar();
                if(useVirtualScroll && virtualUpdateFn) virtualUpdateFn();
            });

            document.addEventListener('keydown', (e) => {
                if((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
                if(e.key === 'Escape' && document.activeElement === searchInput) resetSearch();
            });
        }

        // ---------- 初始化 ----------
        async function init() {
            updateKbdHint();
            initTheme();
            itemHeight = measureListItemHeight();
            bindEvents();
            await loadDictList();
        }

        init();
    })();
</script>
</body>
</html>
